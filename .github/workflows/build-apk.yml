name: Build Quran Android signed APK (interactive Mushaf)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Build interactive Mushaf release APK
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore verified interactive Hafs page cache
        id: mushaf-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/mushaf-svg
          key: quran-ws-hafs-kfqc-b4155f07-604-svg-verified-edition-map-v2

      - name: Retrieve pinned original Mushaf SVG with verse coordinates
        if: steps.mushaf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 --sparse https://github.com/quran-ws/quran-svg.git "$RUNNER_TEMP/quran-svg"
          git -C "$RUNNER_TEMP/quran-svg" sparse-checkout set mushafs/hafs/kfqc/svg
          test "$(git -C "$RUNNER_TEMP/quran-svg" rev-parse HEAD)" = "b4155f07e4aea087d2c458069acff9f7c7e749f6" || { echo '::error::Source revision changed; refusing unreviewed Qur’an pages'; exit 1; }

      - name: Stage and audit all 604 printable pages and clickable ayah polygons
        if: steps.mushaf-cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/prepare_interactive_mushaf.py \
            --source "$RUNNER_TEMP/quran-svg/mushafs/hafs/kfqc/svg" \
            --output app/src/main/assets/mushaf-svg \
            --data app/src/main/assets/quran-data.js

      - name: Full offline content and interaction-map integrity checks
        run: |
          python3 tools/check_interactive_mushaf.py
          python3 tools/qa_integrity_v05.py
          node --check app/src/main/assets/app.js
      - name: Require stable signing secrets and pinned certificate
        env:
          KEYSTORE_B64: ${{ secrets.QURAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QURAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QURAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QURAN_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.QURAN_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured; refusing to generate a new key; see SIGNING_SETUP_AR.md"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/quran-release.jks"
          chmod 600 "$RUNNER_TEMP/quran-release.jks"
          test -s "$RUNNER_TEMP/quran-release.jks"
      - name: Build signed release APK with increasing versionCode
        env:
          QURAN_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/quran-release.jks
          QURAN_SIGNING_STORE_PASSWORD: ${{ secrets.QURAN_STORE_PASSWORD }}
          QURAN_SIGNING_KEY_ALIAS: ${{ secrets.QURAN_KEY_ALIAS }}
          QURAN_SIGNING_KEY_PASSWORD: ${{ secrets.QURAN_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=$((10000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PappVersionCode="$CODE" -PappVersionName="0.8.1.$GITHUB_RUN_NUMBER"
      - name: Verify signature matches permanent owner-held key
        env:
          EXPECTED_CERT_SHA256: ${{ vars.QURAN_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-cert.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then echo '::error::Signing certificate mismatch'; exit 1; fi
      - name: Upload owner-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MadinaQuran-InteractiveMushaf-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/quran-release.jks"
