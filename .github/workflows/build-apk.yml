name: Build Quran Android signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Build permanently signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Quran data and Javascript syntax
        run: |
          python3 tools/qa_integrity_v05.py
          node --check app/src/main/assets/app.js

      - name: Require stable signing secrets and pinned certificate
        env:
          KEYSTORE_B64: ${{ secrets.QURAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QURAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QURAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QURAN_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.QURAN_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured; refusing to create a new signing key. See SIGNING_SETUP_AR.md"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/quran-release.jks"
          chmod 600 "$RUNNER_TEMP/quran-release.jks"
          test -s "$RUNNER_TEMP/quran-release.jks"
          echo "A saved signing key is configured (not generated by CI)."

      - name: Build the signed release APK
        env:
          QURAN_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/quran-release.jks
          QURAN_SIGNING_STORE_PASSWORD: ${{ secrets.QURAN_STORE_PASSWORD }}
          QURAN_SIGNING_KEY_ALIAS: ${{ secrets.QURAN_KEY_ALIAS }}
          QURAN_SIGNING_KEY_PASSWORD: ${{ secrets.QURAN_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=$((10000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PappVersionCode="$CODE" \
            -PappVersionName="0.6.$GITHUB_RUN_NUMBER"

      - name: Validate release signature against the saved certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ vars.QURAN_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-cert.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Signing certificate differs from the certificate approved for this app. Refusing to publish APK."
            exit 1
          fi
          echo "The signing certificate matches the pinned SHA-256 fingerprint."
          ls -lh "$APK"

      - name: Upload update-compatible signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MadinaQuran-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/quran-release.jks"
